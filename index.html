<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="e-Kinerja Penyuluh — Sistem Dokumentasi dan Rekap Kinerja Penyuluh">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="e-Kinerja">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>e-Kinerja Penyuluh</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937}
    .panel{width:min(560px,100%);background:#fff;border:1px solid #dbe3ea;border-radius:20px;padding:30px;box-shadow:0 12px 34px #0f172a18;text-align:center}
    .logo{width:76px;height:76px;object-fit:contain;margin-bottom:12px}
    h1{font-size:23px;margin:0 0 8px;color:#064e3b}
    p{line-height:1.6;color:#64748b;margin:8px 0 20px}
    .btn{display:inline-block;background:#0f766e;color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:11px}
    .small{font-size:12px;margin-top:18px}
    .spinner{width:22px;height:22px;border:3px solid #d1fae5;border-top-color:#0f766e;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="./icon-192.png" alt="Logo e-Kinerja">
    <h1>e-Kinerja Penyuluh</h1>
    <p>Sistem Dokumentasi &amp; Rekap Kinerja Penyuluh</p>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">Membuka aplikasi melalui Google Apps Script…</p>
    <a class="btn" id="openApp" href="https://script.google.com/macros/s/AKfycbx5Ss1T5DWHnyfPRtv73lWVHMcr-JoIDQ4_3DXfuy0HbRLLlCfW2WneM8Txq7Ez-zaWLw/exec">Buka Aplikasi</a>
    <p class="small">Jika halaman tidak berpindah otomatis, tekan tombol “Buka Aplikasi”.</p>
  </main>
  <script>
    // Buka Web App sebagai halaman utama (top-level), bukan di dalam iframe.
    // Ini menghindari kegagalan redirect/login Google Drive pada iframe GitHub Pages.
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5Ss1T5DWHnyfPRtv73lWVHMcr-JoIDQ4_3DXfuy0HbRLLlCfW2WneM8Txq7Ez-zaWLw/exec";
    document.getElementById('openApp').href = WEB_APP_URL;
    window.addEventListener('load', () => {
      window.setTimeout(() => {
        document.getElementById('status').textContent = 'Mengalihkan ke aplikasi…';
        window.location.replace(WEB_APP_URL);
      }, 900);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('PWA:', err));
      });
    }
  </script>
</body>
</html>
